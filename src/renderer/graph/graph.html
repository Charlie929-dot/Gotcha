<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gotcha · 图谱</title>
    <link rel="stylesheet" href="./graph.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <h1>记忆球 · 图谱</h1>
        <span id="status" class="status" data-kind="idle">读取中…</span>
      </div>
      <div class="nav">
        <button id="prev" type="button">‹ 前一天</button>
        <span id="date"></span>
        <button id="next" type="button">后一天 ›</button>
        <button id="today" type="button">今天</button>
        <button id="refresh" type="button">刷新</button>
        <span class="spacer"></span>
        <button id="induce" type="button" title="只归纳当前查看日期未处理的事件">立即归纳</button>
        <button id="settings" type="button">设置</button>
        <button id="timeline" type="button">打开时间线</button>
      </div>
    </header>

    <main>
      <section id="consent" class="banner" hidden>
        <div>
          <strong>尚未确认出网</strong>
          <p>归纳会把当天脱敏后的窗口标题与 OCR 摘要发往你配置的 LLM 供应商；确认前不会发送。</p>
        </div>
        <button id="consent-btn" type="button">确认并开始归纳</button>
      </section>

      <section class="canvas-wrap">
        <div id="node-count" class="count"></div>
        <div class="canvas-tools" role="group" aria-label="图谱视图">
          <span class="tools-label">显示</span>
          <label class="type-chip" title="显示/隐藏知识节点">
            <input type="checkbox" data-type-filter="knowledge" checked /> 知识
          </label>
          <label class="type-chip" title="显示/隐藏行为节点">
            <input type="checkbox" data-type-filter="activity" checked /> 行为
          </label>
          <label class="type-chip" title="显示/隐藏保护节点">
            <input type="checkbox" data-type-filter="protected" checked /> 保护
          </label>
          <label class="type-chip" title="显示/隐藏事件节点">
            <input type="checkbox" data-type-filter="event" checked /> 事件
          </label>
          <span class="tools-hint">单击节点看局部图 · 双击看详情</span>
        </div>
        <div id="focus-bar" class="focus-bar" hidden>
          <span>局部图：<strong id="focus-label"></strong></span>
          <button id="focus-exit" type="button">返回全图</button>
        </div>
        <div id="empty" class="state" data-kind="loading">加载中…</div>
        <div id="sigma-container" class="sigma-container"></div>
      </section>
    </main>

    <aside id="panel" class="panel" hidden>
      <header class="panel-head">
        <h2 id="panel-title"></h2>
        <button id="panel-close" type="button" aria-label="关闭">×</button>
      </header>
      <p id="panel-summary" class="panel-summary"></p>
      <p id="panel-meta" class="panel-meta"></p>
      <h3>成员事件</h3>
      <ul id="panel-events" class="panel-events"></ul>
      <button id="panel-timeline" type="button">在时间线中查看</button>
    </aside>

    <aside id="drawer" class="drawer" hidden>
      <header class="panel-head">
        <h2>设置</h2>
        <button id="settings-close" type="button" aria-label="关闭">×</button>
      </header>
      <form id="settings-form">
        <section>
          <h3>归纳</h3>
          <label class="check"><input id="set-auto" type="checkbox" /> 采集运行中自动归纳</label>
          <label>间隔（分钟）<input id="set-interval" type="number" min="1" max="1440" /></label>
          <label>每日 token 预算<input id="set-budget" type="number" min="1000" max="100000000" /></label>
          <label>失败退避（分钟，逗号分隔）<input id="set-backoff" type="text" /></label>
          <label>单批时刻上限<input id="set-batch" type="number" min="1" max="100" /></label>
          <label>输出 token 上限<input id="set-max-tokens" type="number" min="256" max="8192" /></label>
          <label class="check"><input id="set-consent" type="checkbox" /> 已确认出网（D24）</label>
          <p id="usage" class="hint"></p>
        </section>

        <section>
          <h3>供应商</h3>
          <p class="hint">
            直接填写 API Key 即可（保存后立即生效）：密钥写入本机 userData/.env，不进设置库、不写日志、
            不回显。同名环境变量存在时以环境变量为准。
          </p>
          <label>当前供应商<select id="set-active"></select></label>
          <div id="set-providers" class="providers"></div>
          <button id="set-add-provider" type="button">添加供应商</button>
        </section>

        <section>
          <h3>快捷键</h3>
          <label>切换记录<input id="set-hotkey-toggle" type="text" /></label>
          <label>打开图谱<input id="set-hotkey-graph" type="text" /></label>
          <p id="set-hotkey-status" class="hint"></p>
        </section>

        <div class="form-actions">
          <button id="settings-save" type="submit">保存</button>
          <span id="settings-msg" class="hint"></span>
        </div>
      </form>
    </aside>

    <footer id="meta" class="meta"></footer>
    <script type="module" src="./graph.ts"></script>
  </body>
</html>
