<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gotcha · 问记忆</title>
    <link rel="stylesheet" href="./ask.css" />
  </head>
  <body>
    <header class="bar">
      <h1>问记忆</h1>
      <span id="status" class="status" data-kind="idle">就绪</span>
      <button id="new-chat" class="ghost" type="button" title="开一段新对话">＋ 新对话</button>
    </header>

    <div class="layout">
      <aside class="history" aria-label="对话记录">
        <div class="history-head">
          <strong>对话</strong>
          <span id="history-count" class="muted"></span>
        </div>
        <input
          id="history-search"
          class="history-search"
          type="search"
          placeholder="搜问题 / 回答…"
          aria-label="搜索对话记录"
        />
        <ul id="history-list" class="history-list"></ul>
        <button id="history-clear" class="history-clear" type="button">清空记录</button>
      </aside>

      <div class="main-col">
        <aside id="consent" class="consent" hidden>
          <p>
            问记忆要把你问的这句话、几段窗口文本（标题 / 命中原文）和这段对话之前的几轮发给模型。
            确认一次之后不再打扰。
          </p>
          <div class="row">
            <button id="consent-allow" type="button" class="primary">允许发送</button>
            <button id="consent-deny" type="button">不出网</button>
          </div>
        </aside>

        <main id="thread" class="thread" aria-live="polite"></main>

        <form id="form" class="ask" autocomplete="off">
          <input
            id="question"
            name="question"
            type="text"
            maxlength="500"
            placeholder="问一件过去做过的事，也可以接着上一句追问（例如：那上午呢）"
            aria-label="问题"
          />
          <button id="submit" type="submit" class="primary">发送</button>
          <button id="stop" type="button" class="stop" hidden>停止</button>
        </form>

        <section id="evidence" class="evidence" hidden>
          <header class="evidence-head">
            <div>
              <strong id="evidence-title"></strong>
              <p id="evidence-meta" class="muted"></p>
            </div>
            <button id="evidence-close" type="button">关闭</button>
          </header>
          <div id="evidence-shots" class="shots"></div>
          <pre id="evidence-text" class="evidence-text"></pre>
        </section>
      </div>
    </div>

    <script type="module" src="./ask.ts"></script>
  </body>
</html>
